<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sort.io</title>
  <link rel="stylesheet" href="index-style.css">
</head>
<body>

    <nav class="navigation">
      <a href="index.html" class="nav-link">Home</a>
      <a href="#" class="nav-link">Contact Us</a>
      <a href="#" class="nav-link">About Us</a>
    </nav>

  <div class="top-section">
    <div class="top-tagline">
      <h1>The Only Collection Database You'll Ever Need!</h1>
    </div>

    <div class="login-card">
      <h2>Sort.io</h2>
      <label for="username">Username</label>
      <input type="text" id="username">
      <label for="password">Password</label>
      <input type="password" id="password">
      <button type="button" id="login-button">Login</button>
      <button type="button" id="create-account-button">Create Account</button>
      <p id="auth-status" aria-live="polite"></p>
    </div>
  </div>

  <div class="steps-section">
    <div class="step-card">
      <div class="step-label">🗂️ Create a Collection</div>
      <p>Start a fresh list for anything you love.</p>
    </div>
    <div class="step-card">
      <div class="step-label">➕ Add your items</div>
      <p>Drop in all the items you want to add.</p>
    </div>
    <div class="step-card">
      <div class="step-label">✨ Admire!</div>
      <p>Enjoy your completed, organized collection.</p>
    </div>
  </div>

  <section id="item-form-panel" class="item-form-panel" aria-hidden="true">
        <form class="item-form">
            <button type="button" class="close-form" aria-label="Close form">×</button>
            <div class="form-group image-upload">
                <label for="image">Image</label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>
            <div class="form-layout">
                <div class="form-left">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name">
                    </div>

                    <div class="form-group">
                        <label for="item-count">Number of Items</label>
                        <input type="number" id="item-count" name="item-count">
                    </div>

                    <div class="form-group">
                        <label for="value">Value</label>
                        <input type="text" id="value" name="value">
                    </div>

                    <div class="form-group">
                        <label for="collection">Collection</label>
                        <input type="text" id="collection" name="collection">
                    </div>
                </div>

                <div class="form-right">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description"></textarea>
                    </div>
                </div>
            </div>
        </form>
    </section>
      <script src="auth.js"></script>
      <script src="index-auth.js"></script>
      <script src="sort-io.js"></script>
</body>
</html>

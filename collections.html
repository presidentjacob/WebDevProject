<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection</title>
    <link rel="stylesheet" href="index-style.css" />
  </head>

  <body>
    <nav class="navigation">
      <a href="index.html" class="nav-link">Home</a>
      <a href="sort-io.html" class="nav-link">Lists</a>
      <button
        type="button"
        class="new-item"
        aria-label="Log item"
        title="Log item"
      >
        log item
      </button>
    </nav>

    <h1 id="collection-title"></h1>

    <div class="item-toolbar">
      <label for="item-sort-select">Sort items</label>
      <select id="item-sort-select" aria-label="Sort items">
        <option value="newest">Newest</option>
        <option value="rating-desc">Rating: High to low</option>
        <option value="rating-asc">Rating: Low to high</option>
        <option value="quantity-desc">Quantity: High to low</option>
        <option value="quantity-asc">Quantity: Low to high</option>
        <option value="price-desc">Price: High to low</option>
        <option value="price-asc">Price: Low to high</option>
      </select>
    </div>

    <div id="items-container"></div>

    <div id="item-form-panel" class="item-form-panel" aria-hidden="true">
      <form id="item-form" class="item-form" novalidate>
        <button
          type="button"
          id="close-item-form"
          class="close-form"
          aria-label="Close log item form"
        >
          &times;
        </button>
        <h2>Log Item</h2>

        <label for="log-list-select">List</label>
        <select id="log-list-select" required></select>

        <label for="item-name">Item name</label>
        <input id="item-name" type="text" maxlength="120" required />

        <label for="item-photo">Item photo</label>
        <input id="item-photo" type="file" accept="image/*" />

        <label for="item-rating">Rating (1-10)</label>
        <input
          id="item-rating"
          type="number"
          min="1"
          max="10"
          step="1"
          placeholder="Optional"
        />

        <label for="item-price">Price</label>
        <input
          id="item-price"
          type="number"
          min="0"
          step="0.01"
          placeholder="Optional"
        />

        <label for="item-quantity">Quantity</label>
        <input
          id="item-quantity"
          type="number"
          min="1"
          step="1"
          value="1"
          required
        />

        <label for="item-notes">Notes</label>
        <textarea
          id="item-notes"
          rows="3"
          maxlength="500"
          placeholder="Optional"
        ></textarea>

        <p id="item-form-feedback" role="status" aria-live="polite"></p>
        <button type="submit">Save Item</button>
      </form>
    </div>

    <script src="auth.js"></script>
    <script src="collections.js"></script>
  </body>
</html>
